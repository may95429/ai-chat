<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>AI 客服</title>
    <style>
      body {
        font-family: Arial;
        margin: 0;
      }
      #chat {
        height: 90vh;
        overflow-y: auto;
        padding: 10px;
      }
      .msg {
        margin: 5px 0;
      }
      .user {
        text-align: right;
        color: blue;
      }
      .bot {
        text-align: left;
        color: green;
      }
      #input {
        display: flex;
        border-top: 1px solid #ccc;
      }
      input {
        flex: 1;
        padding: 10px;
      }
      button {
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <div id="chat"></div>

    <div id="input">
      <input id="text" placeholder="輸入訊息..." />
      <button onclick="send()">送出</button>
    </div>

    <script>
      async function send() {
        const input = document.getElementById("text");
        const text = input.value;

        addMsg(text, "user");

        const res = await fetch("你的 n8n webhook URL", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ question: text }),
        });

        const data = await res.json();
        addMsg(data.answer || "沒有回應", "bot");

        input.value = "";
      }

      function addMsg(text, type) {
        const div = document.createElement("div");
        div.className = "msg " + type;
        div.innerText = text;
        document.getElementById("chat").appendChild(div);
      }
    </script>
  </body>
</html>
