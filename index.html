<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>AI 客服</title>

    <style>
      body {
        margin: 0;
        font-family: Arial;

        /* ✅ 修正透明問題 */
        background: #f5f7fb;
      }

      /* 外層容器 */
      #container {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      /* 聊天區 */
      #chat {
        flex: 1;
        overflow-y: auto;
        padding: 10px;
      }

      /* 訊息 */
      .msg {
        margin: 8px 0;
      }

      .user {
        text-align: right;
        color: #333;
      }

      .bot {
        text-align: left;
        color: #4caf50;
      }

      /* ✅ 輸入區固定底部 */
      #inputArea {
        display: flex;
        border-top: 1px solid #ddd;
        background: white;
        padding: 10px;
      }

      #text {
        flex: 1;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #ccc;
      }

      button {
        margin-left: 10px;
        padding: 10px 15px;
        border: none;
        background: #6c63ff;
        color: white;
        border-radius: 8px;
        cursor: pointer;
      }

      .user {
        text-align: right;
        color: #333;
        font-weight: bold;
      }

      .bot {
        text-align: left;
        color: #4caf50;
      }
    </style>
  </head>

  <body>
    <div id="container">
      <!-- 聊天內容 -->
      <div id="chat"></div>

      <!-- 輸入區 -->
      <div id="inputArea">
        <input id="text" placeholder="輸入訊息..." />
        <button onclick="send()">送出</button>
      </div>
    </div>

    <script>
      async function send() {
        const input = document.getElementById("text");
        const text = input.value.trim();

        // 防呆：空白不送
        if (!text) return;

        // ✅ 顯示「您」
        addMsg("您： " + text, "user");

        // ✅ 先清空輸入框（關鍵🔥）
        input.value = "";

        // ✅ 加這行（關鍵🔥）
        const loadingId = addMsg("AI： 正在輸入中...", "bot");

        try {
          const res = await fetch(
            "https://wenwen95429.app.n8n.cloud/webhook/chat0424",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ question: text }),
            },
          );

          const data = await res.json();

          // ✅ 顯示 AI 回答
          addMsg("AI： " + (data.answer || "沒有回應"), "bot");
        } catch (err) {
          addMsg("AI： 發生錯誤，請稍後再試", "bot");
        }
      }

      function addMsg(text, type) {
        const div = document.createElement("div");
        div.className = "msg " + type;
        div.innerText = text;

        document.getElementById("chat").appendChild(div);

        // 自動滾到底
        const chat = document.getElementById("chat");
        chat.scrollTop = chat.scrollHeight;
      }
    </script>
  </body>
</html>
