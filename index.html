<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>AI 客服</title>

    <style>
      body {
        margin: 0;
        font-family: Arial;
        background: #f5f7fb;
      }

      /* 外層 */
      #container {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      /* 聊天區 */
      #chat {
        flex: 1;
        overflow-y: auto;
        padding: 12px;
      }

      /* 訊息 */
      .msg {
        margin: 8px 0;
        line-height: 1.5;
      }

      /* 使用者 */
      .user {
        text-align: right;
        color: #333;
        font-weight: bold;
      }

      /* AI */
      .bot {
        text-align: left;
        color: #4caf50;

        /* ✨ 淡入動畫 */
        animation: fadeIn 0.3s ease;
      }

      /* ✨ 動畫 */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* 輸入區 */
      #inputArea {
        display: flex;
        padding: 10px;
        border-top: 1px solid #ddd;
        background: white;
      }

      /* 輸入框 */
      #text {
        flex: 1;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 14px;
      }

      /* 按鈕 */
      button {
        margin-left: 10px;
        padding: 10px 15px;
        border: none;
        background: #6c63ff;
        color: white;
        border-radius: 8px;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <div id="container">
      <!-- 聊天內容 -->
      <div id="chat"></div>

      <!-- 輸入區 -->
      <div id="inputArea">
        <input id="text" placeholder="輸入訊息..." />
        <button onclick="send()">送出</button>
      </div>
    </div>

    <script>
      async function send() {
        const input = document.getElementById("text");
        const text = input.value.trim();

        if (!text) return;

        // 顯示使用者訊息
        addMsg("您： " + text, "user");

        // 清空輸入框
        input.value = "";

        // 建立 loading
        const loadingDiv = document.createElement("div");
        loadingDiv.className = "msg bot";
        loadingDiv.innerText = "AI：正在輸入中...";
        document.getElementById("chat").appendChild(loadingDiv);

        scrollToBottom();

        try {
          const res = await fetch(
            "https://wenwen95429.app.n8n.cloud/webhook/chat0424",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ question: text }),
            },
          );

          const data = await res.json();

          // 用結果覆蓋 loading（關鍵🔥）
          loadingDiv.innerText = "AI： " + (data.answer || "沒有回應");
        } catch (err) {
          loadingDiv.innerText = "AI： 發生錯誤，請稍後再試";
        }
      }

      // 新增訊息
      function addMsg(text, type) {
        const div = document.createElement("div");
        div.className = "msg " + type;
        div.innerText = text;

        document.getElementById("chat").appendChild(div);
        scrollToBottom();
      }

      // 自動滾動
      function scrollToBottom() {
        const chat = document.getElementById("chat");
        chat.scrollTop = chat.scrollHeight;
      }

      // Enter送出（加分🔥）
      document.getElementById("text").addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          send();
        }
      });
    </script>
  </body>
</html>
